[project]
name = "aegis-ai"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "boto3>=1.40,<2",
    "duckdb>=1.4,<2",
    "httpx>=0.28,<1",
    "polars>=1.30,<2",
    "pyarrow>=19,<30",
    "pydantic>=2.10,<3",
    "pyiceberg>=0.9,<1",
    "python-dotenv>=1,<2",
    "pytz>=2025.2",
]

[dependency-groups]
backend = [
    "fastapi>=0.115,<1",
    "mcp>=1.20,<2",
    "pyjwt[crypto]>=2.10,<3",
    "uvicorn>=0.30,<1",
]
dev = [
    "mypy>=1.18,<2",
    "pytest>=8,<10",
    "ruff>=0.11,<1",
    "sqlalchemy>=2,<3",
]
infra = [
    "aws-cdk-lib>=2.230,<3",
    "boto3[crt]>=1.41,<2",
    "constructs>=10,<11",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["live: integrates with captured live provider data"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
